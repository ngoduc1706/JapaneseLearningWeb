<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Japanese Learning</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2DD4BF;
            --primary-dark: #0D9488;
            --text-dark: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #E0F7FA 0%, #80DEEA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.98);
            border-radius: 35px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            border: 1px solid white;
            width: 100%;
            max-width: 440px;
        }
        .card-title {
            font-size: 26px; font-weight: 800; color: var(--text-dark);
            text-align: center; margin-bottom: 10px;
        }
        .card-subtitle {
            font-size: 14px; color: #95a5a6;
            text-align: center; margin-bottom: 30px;
        }
        .alert-invalid {
            background: #fef2f2; border: 1px solid #fca5a5;
            color: #b91c1c; border-radius: 12px; padding: 16px;
            text-align: center; margin-bottom: 20px;
            display: none;
        }
        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--text-dark); display: block; margin-bottom: 8px; }
        .input-box { position: relative; }
        .input-box input {
            width: 100%; padding: 16px 15px 16px 50px;
            border: 2px solid #f0f3f5; border-radius: 15px;
            background: #f8fafb; outline: none; transition: 0.3s;
            font-size: 15px;
        }
        .input-box input:focus {
            border-color: var(--primary); background: #fff;
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.1);
        }
        .field-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: #bdc3c7; width: 20px; height: 20px;
        }
        .btn-submit {
            width: 100%; padding: 18px; margin-top: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff; border: none; border-radius: 15px;
            font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(13,148,136,0.3); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .divider { text-align: center; color: #95a5a6; font-size: 14px; margin-top: 25px; }
        .divider a { color: var(--primary-dark); font-weight: 700; text-decoration: none; }
        .notification {
            position: fixed; top: 20px; right: 20px; padding: 16px 24px;
            border-radius: 12px; color: white; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideIn 0.3s ease-out;
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .notification.success { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .notification.error { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .notification.info { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="card-title">Đặt lại mật khẩu</h2>
        <p class="card-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

        <div id="invalidAlert" class="alert-invalid">
            <i data-lucide="alert-triangle" size="18" style="vertical-align:middle;margin-right:6px;"></i>
            Liên kết không hợp lệ hoặc đã hết hạn. <a th:href="@{/forgot-password}">Yêu cầu lại</a>.
        </div>

        <form id="resetForm">
            <input type="hidden" id="resetToken" th:value="${token}">
            <div class="form-group">
                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                <div class="input-box">
                    <i data-lucide="lock" class="field-icon"></i>
                    <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)" minlength="6" required>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                <div class="input-box">
                    <i data-lucide="lock-keyhole" class="field-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <i data-lucide="check-circle" size="20"></i>
                CẬP NHẬT MẬT KHẨU
            </button>
        </form>

        <p class="divider">
            <a th:href="@{/login}">Quay lại đăng nhập</a>
        </p>
    </div>

    <script>
        lucide.createIcons();

        const REDIRECT_DELAY_MS = 2000;
        const NOTIFICATION_DURATION_MS = 5000;

        // Show error if token is missing from URL
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const tokenInput = document.getElementById('resetToken');

        // Prefer URL param over th:value (handles direct navigation)
        if (tokenFromUrl) {
            tokenInput.value = tokenFromUrl;
        }

        if (!tokenInput.value || tokenInput.value.trim() === '') {
            document.getElementById('invalidAlert').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = tokenInput.value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            if (newPassword !== confirmPassword) {
                showNotification('Mật khẩu xác nhận không khớp', 'error', 'alert-circle');
                return;
            }

            btn.disabled = true;
            showNotification('Đang xử lý...', 'info', 'loader-2');

            const formData = new FormData();
            formData.append('token', token);
            formData.append('newPassword', newPassword);

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    showNotification(data.message, 'success', 'check-circle');
                    setTimeout(() => window.location.href = '/login', REDIRECT_DELAY_MS);
                } else {
                    showNotification(data.message, 'error', 'alert-circle');
                    btn.disabled = false;
                }
            } catch (error) {
                showNotification('Lỗi kết nối: ' + error.message, 'error', 'wifi-off');
                btn.disabled = false;
            }
        });

        function showNotification(message, type = 'info', iconName = 'info') {
            document.querySelectorAll('.notification').forEach(n => n.remove());
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<i data-lucide="${iconName}" size="20"></i><span>${message}</span>`;
            document.body.appendChild(notification);
            lucide.createIcons();
            setTimeout(() => notification.remove(), NOTIFICATION_DURATION_MS);
        }
    </script>
</body>
</html>
