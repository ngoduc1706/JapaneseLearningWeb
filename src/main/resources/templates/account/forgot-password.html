<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Japanese Learning</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2DD4BF;
            --primary-dark: #0D9488;
            --accent: #F4D03F;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #E0F7FA 0%, #80DEEA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px;
            width: 90%;
            max-width: 1300px;
            z-index: 10;
        }

        .left-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-area {
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
        }

        .logo-icon-wrapper {
            background: var(--primary);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            color: white;
        }

        .logo-text {
            font-size: 28px; font-weight: 900; color: var(--primary-dark);
            text-transform: uppercase; letter-spacing: -1px;
        }

        .hero-text {
            font-size: 42px; font-weight: 900; color: var(--text-dark);
            line-height: 1.2; margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.5);
        }

        .illustration-wrapper {
            position: relative;
            width: 550px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-img {
            width: 100%;
            height: auto;
            z-index: 5;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.2));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .character-img:hover { transform: scale(1.05); }

        .floating-icon {
            position: absolute;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 800;
            color: var(--primary-dark);
            animation: floating 4s infinite ease-in-out;
            border: 1px solid white;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-jlpt { top: -5%; right: 5%; animation-delay: 0s; color: #e74c3c; }
        .icon-book { top: 15%; left: -10%; animation-delay: 1s; }
        .icon-idea { bottom: 15%; right: -5%; animation-delay: 2s; }

        .right-card {
            flex: 0 0 420px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 35px; padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            border: 1px solid white;
        }

        .card-title { font-size: 28px; font-weight: 800; color: var(--text-dark); text-align: center; margin-bottom: 10px; }
        .card-subtitle { text-align: center; color: #95a5a6; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }
        .input-box { position: relative; }
        .input-box input {
            width: 100%; padding: 16px 15px 16px 50px;
            border: 2px solid #f0f3f5; border-radius: 15px;
            background: #f8fafb; outline: none; transition: 0.3s;
            font-size: 15px;
        }
        .input-box input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.1); }

        .field-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: #bdc3c7; width: 20px; height: 20px;
        }

        .btn-submit {
            width: 100%; padding: 18px; margin-top: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff; border: none; border-radius: 15px;
            font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(13, 148, 136, 0.3); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .divider { text-align: center; color: #95a5a6; font-size: 14px; margin-top: 25px; }
        .divider a { color: var(--primary-dark); font-weight: 800; text-decoration: none; }

        .notification {
            position: fixed; top: 20px; right: 20px; padding: 16px 24px;
            border-radius: 12px; color: white; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideIn 0.3s ease-out;
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .notification.success { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .notification.error { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .notification.info { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }

        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }

        @media (max-width: 1100px) {
            .page-container { flex-direction: column; gap: 50px; padding: 60px 20px; overflow-y: auto; }
            .illustration-wrapper { width: 100%; max-width: 450px; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="left-content">
            <div class="logo-area">
                <div class="logo-icon-wrapper">
                    <i data-lucide="languages" size="28"></i>
                </div>
                <span class="logo-text">Japanese Learning</span>
            </div>

            <h1 class="hero-text">
                Khôi phục tài khoản<br>
                Tiếp tục hành trình<br>
                Chinh phục tiếng Nhật.
            </h1>

            <div class="illustration-wrapper">
                <div class="floating-icon icon-jlpt">
                    <i data-lucide="award" size="20"></i> JLPT N2
                </div>
                <div class="floating-icon icon-book">
                    <i data-lucide="book-open" size="20"></i> Từ vựng
                </div>
                <div class="floating-icon icon-idea">
                    <i data-lucide="lightbulb" size="20"></i> Ngữ pháp
                </div>
                <img th:src="@{/assets/nhan-vat.png}" alt="Learning Character" class="character-img">
            </div>
        </div>

        <div class="right-card">
            <h2 class="card-title">Quên mật khẩu?</h2>
            <p class="card-subtitle">Nhập email đăng ký của bạn. Chúng tôi sẽ gửi link đặt lại mật khẩu đến hộp thư của bạn.</p>

            <form id="forgotForm">
                <div class="form-group">
                    <div class="input-box">
                        <i data-lucide="mail" class="field-icon"></i>
                        <input type="email" id="forgotEmail" name="email" placeholder="Email của bạn" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    GỬI LINK ĐẶT LẠI
                    <i data-lucide="send" size="20"></i>
                </button>

                <p class="divider">
                    Nhớ mật khẩu rồi? <a th:href="@{/login}">Đăng nhập</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            showNotification('Đang xử lý...', 'info', 'loader-2');

            try {
                const formData = new FormData();
                formData.append('email', email);

                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    showNotification(data.message, 'success', 'check-circle');
                    document.getElementById('forgotForm').reset();
                    setTimeout(() => { submitBtn.disabled = false; }, 30000);
                } else {
                    showNotification(data.message, 'error', 'alert-circle');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                showNotification('Có lỗi xảy ra. Vui lòng thử lại sau.', 'error', 'wifi-off');
                submitBtn.disabled = false;
            }
        });

        function showNotification(message, type = 'info', iconName = 'info') {
            document.querySelectorAll('.notification').forEach(n => n.remove());

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i data-lucide="${iconName}" size="20"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(notification);
            lucide.createIcons();

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out forwards';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }
    </script>
</body>
</html>
